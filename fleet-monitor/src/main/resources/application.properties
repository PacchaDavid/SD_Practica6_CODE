# ── Aplicación ────────────────────────────────────────────────────────────────
spring.application.name=fleet-monitor
server.port=8080

# ── RabbitMQ ──────────────────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
spring.rabbitmq.virtual-host=/

# Reintentos de conexión al iniciar (útil si RabbitMQ tarda en arrancar)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=3000
spring.rabbitmq.listener.simple.retry.max-attempts=5

# ── H2 (Base de datos en memoria para pruebas) ────────────────────────────────
spring.datasource.url=jdbc:h2:mem:fleetdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.fleet.monitor=DEBUG
logging.level.org.springframework.amqp=INFO
